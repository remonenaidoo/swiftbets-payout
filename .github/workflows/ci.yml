name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    with:
      images: '[{"name": "swiftbets-payout", "dockerfile": "deploy/SwiftBets.Payout.Worker.Dockerfile"}, {"name": "swiftbets-payout-migrator", "dockerfile": "deploy/SwiftBets.Payout.Migrator.Dockerfile"}]'
    permissions:
      contents: read
      packages: write
      security-events: write
